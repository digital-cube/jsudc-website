name: CI

on:
  push:
    branches: [main, v1]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # starlight-links-validator fails the build on a broken internal link.
      - run: npm run build

  snippets:
    runs-on: ubuntu-latest
    # Until @jsudc/* is on npm the install fails; drop this line once it is.
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: snippets
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # every snippet compiled against the published packages, the quick starts run
      - run: npm run check:snippets
        env:
          SNIPPETS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/snippets
