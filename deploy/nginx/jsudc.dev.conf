# =====================================================================
# jsudc.dev — the jsudc website (Astro + Starlight), production.
# www.jsudc.dev answers 301 to https://jsudc.dev.
#
# VM digitalcube-production-websites (hetzner2). TLS is terminated
# UPSTREAM (the edge h2, Let's Encrypt lineage jsudc.dev), so this vhost
# listens on :80 only.
#
# Static files only: deploy/prod.sh builds the site into
#   /home/digital/sites/jsudc.dev/releases/<short sha>/
# and atomically repoints the `current` symlink this root follows.
# /_astro/* is content-hashed and cached for a year; everything else
# (HTML, pagefind's index, the sitemap) is revalidated on every request.
# A path that does not exist is a real 404 with the site's 404 page.
#
# Install (deploy/prod.sh --install does this, from the checkout it deploys;
# the hand-written "coming soon" vhost stays as sites-available/jsudc.dev.coming-soon):
#   sudo ln -sfn /home/digital/sites/jsudc.dev/src/deploy/nginx/jsudc.dev.conf \
#       /etc/nginx/sites-available/jsudc.dev
#   sudo ln -sfn /etc/nginx/sites-available/jsudc.dev /etc/nginx/sites-enabled/jsudc.dev
#   sudo nginx -t && sudo systemctl reload nginx
#
# Deploy:  deploy/prod.sh
# =====================================================================

server {
    listen 80;
    listen [::]:80;

    server_name www.jsudc.dev;

    return 301 https://jsudc.dev$request_uri;
}

server {
    listen 80;
    listen [::]:80;

    server_name jsudc.dev;

    access_log /var/log/nginx/jsudc.dev.access.log;
    error_log  /var/log/nginx/jsudc.dev.error.log;

    root  /home/digital/sites/jsudc.dev/current;
    index index.html;

    # /get-started -> /get-started/ as a relative Location: the edge speaks
    # https, this vhost does not know it.
    absolute_redirect off;

    error_page 404 /404.html;

    # Hashed by Astro: a changed file gets a new name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }
}
