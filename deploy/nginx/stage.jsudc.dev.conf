# =====================================================================
# stage.jsudc.dev — the jsudc website (Astro + Starlight), stage.
#
# TLS is terminated UPSTREAM (the edge at 65.108.45.136, the same one in
# front of every *.igor.digitalcube.work site on this VM), so this vhost
# listens on :80 only.
#
# Static files only: deploy/stage.sh builds the site into
#   /home/digital/sites/stage.jsudc.dev/releases/<short sha>/
# and atomically repoints the `current` symlink this root follows.
# /_astro/* is content-hashed and cached for a year; everything else
# (HTML, pagefind's index, the sitemap) is revalidated on every request.
# A path that does not exist is a real 404 with the site's 404 page.
#
# Install (deploy/stage.sh --install does this, from the checkout it deploys):
#   sudo ln -sfn /home/digital/sites/stage.jsudc.dev/src/deploy/nginx/stage.jsudc.dev.conf \
#       /etc/nginx/sites-enabled/stage.jsudc.dev
#   sudo nginx -t && sudo systemctl reload nginx
#
# Deploy:  deploy/stage.sh
# =====================================================================

server {
    listen 80;
    listen [::]:80;

    server_name stage.jsudc.dev;

    access_log /var/log/nginx/stage.jsudc.access.log;
    error_log  /var/log/nginx/stage.jsudc.error.log;

    root  /home/digital/sites/stage.jsudc.dev/current;
    index index.html;

    # /get-started -> /get-started/ as a relative Location: the edge speaks
    # https, this vhost does not know it.
    absolute_redirect off;

    error_page 404 /404.html;

    # Hashed by Astro: a changed file gets a new name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
    }
}
